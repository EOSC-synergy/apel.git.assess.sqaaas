config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/apel/apel:
      branch: dev
      repo: https://github.com/apel/apel.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/apel/apel git:
        commands:
        - /usr/bin/env sh .sqa/script.teal_practical_ocelot.sh
        container: qc.acc_tundra_harmonious_griffin
  QC.Doc:
    repos:
      github.com/apel/apel find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.dawn_fearless_ibis.sh
        container: qc.doc_paprika_organized_chimpanzee
      github.com/apel/apel git:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_diplomatic_goat.sh
        container: qc.doc_cloud_bold_swan
      github.com/apel/apel markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.navy_energetic_badger.sh
        container: qc.doc_chili_vibrant_fox
  QC.Lic:
    repos:
      github.com/apel/apel licensee:
        commands:
        - /usr/bin/env sh .sqa/script.caramel_artistic_caribou.sh
        container: qc.lic_lavender_playful_weasel
  QC.Sec:
    repos:
      github.com/apel/apel bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cerulean_dreamy_raccoon.sh
        container: qc.sec_umber_rugged_caiman

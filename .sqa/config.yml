      github.com/apel/apel flake8:
        commands:
        - /usr/bin/env sh .sqa/script.forest_enthusiastic_ferret.sh
        container: qc.sty_grape_helpful_moose
  QC.Uni:
    repos:
      github.com/apel/apel pytest:
        commands:
        - /usr/bin/env sh .sqa/script.purple_artistic_jellyfish.sh
        container: qc.uni_coffee_confused_giraffe
  QC.Ver:
    repos:
      github.com/apel/apel get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.mustard_upbeat_dormouse.sh
        container: qc.ver_ceru_reflective_jellyfish
